name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# Push lien tiep vao cung mot nhanh thi huy luot cu, khoi ton phut chay
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # build = tsc -b && vite build, nen da bao gom kiem tra kieu
      - run: yarn build
