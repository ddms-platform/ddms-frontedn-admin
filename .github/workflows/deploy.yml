name: CI/CD - Deploy Admin to VM

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build
        run: yarn build

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e

            REAL_GIT=$(command -v git)
            WRAP_DIR=$(mktemp -d)
            trap "rm -rf \"$WRAP_DIR\"" EXIT

            cat > "$WRAP_DIR/git" <<EOF
          #!/usr/bin/env bash
          set -e
          REAL_GIT="$REAL_GIT"

          case "\$1" in
            pull|merge|rebase)
              if "\$REAL_GIT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                "\$REAL_GIT" restore --worktree -- yarn.lock package-lock.json 2>/dev/null || "\$REAL_GIT" checkout -- yarn.lock package-lock.json 2>/dev/null || true
                "\$REAL_GIT" clean -f -- package-lock.json pnpm-lock.yaml 2>/dev/null || true
              fi
              ;;
          esac

          exec "\$REAL_GIT" "\$@"
          EOF
            chmod +x "$WRAP_DIR/git"

            PATH="$WRAP_DIR:$PATH" bash ~/deploy-admin.sh
          '
